name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.2.0) — leave blank to release the current Cargo.toml version"
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Release v${{ inputs.version || '(current)' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Use a PAT or the default token — needs push + tag permissions.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      # ── Optional version bump ──────────────────────────────────────────────
      - name: Bump version in Cargo.toml
        if: ${{ inputs.version != '' }}
        run: sed -i "s/^version = \".*\"/version = \"${{ inputs.version }}\"/" Cargo.toml

      - name: Resolve release version
        id: ver
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | python3 -c "import sys,json; print(json.load(sys.stdin)['packages'][0]['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # ── Build & verify ─────────────────────────────────────────────────────
      - name: Check
        run: cargo check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Test
        run: cargo test --all-features

      - name: Verify package
        run: cargo package --list

      # ── Commit bump, tag, push ─────────────────────────────────────────────
      - name: Commit version bump
        if: ${{ inputs.version != '' }}
        run: |
          git config user.email "thruqe@gmail.com"
          git config user.name "Thruqe"
          git add Cargo.toml
          git diff --cached --quiet || git commit -m "chore: release v${{ steps.ver.outputs.version }}"

      - name: Create and push tag
        run: |
          git config user.email "thruqe@gmail.com"
          git config user.name "Thruqe"
          git tag "v${{ steps.ver.outputs.version }}" 2>/dev/null \
            || echo "Tag v${{ steps.ver.outputs.version }} already exists — skipping."
          git push origin "v${{ steps.ver.outputs.version }}" 2>/dev/null \
            || echo "Tag already on remote — skipping push."
          git push origin HEAD:main || true

      # ── GitHub release ─────────────────────────────────────────────────────
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.ver.outputs.version }}" \
            --title "v${{ steps.ver.outputs.version }}" \
            --generate-notes \
            --latest \
          || echo "Release v${{ steps.ver.outputs.version }} already exists — skipping."

      # ── crates.io publish ──────────────────────────────────────────────────
      - name: Publish to crates.io
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

[package]
name = "whatsrook-sdk"
version = "0.1.0"
edition = "2024"
authors = ["Thruqe <thruqe@gmail.com>"]
description = "Rust SDK for building WhatsRook external plugins"
documentation = "https://docs.rs/whatsrook-sdk"
homepage = "https://github.com/Thruqe/whatsrook-sdk"
repository = "https://github.com/Thruqe/whatsrook-sdk"
license = "MIT"
readme = "README.md"
keywords = ["whatsrook", "whatsapp", "bot", "plugin", "sdk"]
categories = ["api-bindings", "network-programming"]
include = [
    "src/**/*",
    "examples/**/*",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "blocking",
    "rustls-tls",
] }

[[example]]
name = "hello"
path = "examples/hello.rs"

[[example]]
name = "live_ticker"
path = "examples/live_ticker.rs"

[[example]]
name = "media_reply"
path = "examples/media_reply.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
